version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gkarting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gkarting
      POSTGRES_PASSWORD: gkarting_password
      POSTGRES_DB: gkarting
    ports:
      - "5432:5432"
    volumes:
      - gkarting_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gkarting"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gkarting-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://gkarting:gkarting_password@postgres:5432/gkarting?schema=public
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/main"

volumes:
  gkarting_pg_data:
